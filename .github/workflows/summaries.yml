name: Meeting Summaries

# YouTube blocks transcript requests from GitHub-hosted runners, so this job
# runs on a self-hosted runner on a home computer. If that computer is off,
# the run waits in the queue (up to 24 hours) until it comes back online.

on:
  schedule:
    # 8 AM ET every morning (12:00 UTC), an hour after the data refresh
    - cron: '0 12 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

concurrency:
  group: summaries
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: [self-hosted, macOS]

    permissions:
      contents: write  # needed to commit updated summaries.json

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python environment
        run: |
          VENV="$HOME/.openbeverly-venv"
          [ -x "$VENV/bin/python" ] || python3 -m venv "$VENV"
          "$VENV/bin/pip" install --quiet --upgrade anthropic youtube-transcript-api
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Refresh AI summaries (new and previously failed videos)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python summarize.py --max 10

      - name: Commit updated summaries
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add summaries.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh meeting summaries $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
