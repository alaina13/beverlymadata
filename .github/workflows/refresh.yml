name: Refresh Data

on:
  schedule:
    # 7 AM ET every morning (11:00 UTC, accounts for EDT offset)
    - cron: '0 11 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI
    inputs:
      agenda_max:
        description: 'Max agendas to transcribe this run (use a larger number for a one-time catch-up)'
        default: '25'

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit updated JSON files back

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic youtube-transcript-api feedparser pypdf

      - name: Fetch meeting data
        run: python3 fetch_data.py

      - name: Fetch civic data
        run: python3 fetch_civic_data.py

      - name: Track Street Paving page
        run: python3 fetch_street_paving.py

      # Adds new meetings from the channel feed. YouTube usually blocks the
      # transcript fetch here, so a daily Claude task fills those entries in.
      - name: Refresh AI summaries (new and previously failed videos)
        continue-on-error: true  # a failure here shouldn't block the other data updates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # YouTube blocks transcript requests from GitHub's IPs; set one of these
          # repo secrets to route them through a proxy.
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
        run: python3 summarize.py --max 10

      - name: Transcribe scanned agendas (new agendas only)
        continue-on-error: true  # a failure here shouldn't block the other data updates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 transcribe_agendas.py --max ${{ inputs.agenda_max || 25 }}

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meetings.json calendar.json summaries.json agenda_text.json civic_data.json street_paving_history.json
          git diff --staged --quiet || git commit -m "chore: refresh data $(date -u '+%Y-%m-%d')"
          # A commit may have landed while this run was working; rebase onto it
          # so the refreshed data isn't lost.
          git pull --rebase
          git push
